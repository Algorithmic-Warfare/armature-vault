name: Move build & test

# Trigger note: this workflow uses `pull_request` (NOT `pull_request_target`).
# That means fork PRs run their own untrusted code in CI — which is safe here
# because the workflow has no secrets and no write permissions. Do NOT migrate
# to `pull_request_target` without adding explicit guardrails (fork-allowlist,
# manual approval, or a separate restricted job).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: move-test-${{ github.ref }}
  cancel-in-progress: true

# Pinned dependency revs, shared by every package. Keep in sync with the
# packages' Move.toml files: when you bump a pin there, bump it here too.
env:
  ARMATURE_REV: "ae60685f888ac5dd4d24413fb989002ef5315c74"
  MULTICOIN_REV: "2772c26d24c02671726d39f167b8f772777875d9"
  WORLD_REV: "d33ff232bd3878e8f9ad0721e18564b21facc925"
  WAREHOUSE_RECEIPTS_REV: "212be7c5ee1ee8bca55305e86e1ae549df78c279"

jobs:
  # The move-test matrix is listed by hand so each package's pins and allowed
  # deps stay explicit. This job fails when a package under packages/ has no
  # matrix entry, or an entry names a package that no longer exists.
  matrix-check:
    name: every Move package is in the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare packages/**/Move.toml with the matrix
        run: |
          set -euo pipefail
          listed=$(grep -E '^ +- path: ' .github/workflows/move-test.yml | awk '{print $3}' | sort -u)
          found=$(find packages -name Move.toml -not -path '*/build/*' \
            | sed -e 's|^packages/||' -e 's|/Move.toml$||' | sort -u)
          missing=$(comm -13 <(echo "$listed") <(echo "$found"))
          stale=$(comm -23 <(echo "$listed") <(echo "$found"))
          for p in $missing; do echo "::error::packages/$p has no move-test matrix entry"; done
          for p in $stale; do echo "::error::matrix entry $p has no packages/$p/Move.toml"; done
          [ -z "$missing$stale" ]
          echo "matrix covers: $(echo $found)"

  move-test:
    name: sui move test (${{ matrix.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # One job per Move package. Its name (the Move.lock root entry) is read
      # from its Move.toml, so it can't drift from the path.
      #   path:  the package directory under packages/
      #          ({primitives,composites,extensions,integration}/<pkg>)
      #   pins:  which shared revs its Move.lock must carry
      #   deps:  the only direct dependencies it may have. This keeps the
      #          dependency boundaries explicit: delivery_agreements must never
      #          gain anything beyond multicoin and the agreements primitive,
      #          agreement_roles must never depend on an agreement type, and
      #          only roles, agreement_roles and armature_vault may bring
      #          armature into the agreements stack. Only the unpublished
      #          integration packages may combine tiers.
      matrix:
        include:
          - path: composites/armature_vault
            pins: armature multicoin world warehouse_receipts
            # @todo(roles): add `roles` here when armature_vault switches to it.
            deps: armature multicoin std sui warehouse_receipts world
          - path: primitives/roles
            pins: armature
            deps: armature std sui
          - path: primitives/agreements
            pins: multicoin
            deps: multicoin std sui
          - path: composites/delivery_agreements
            pins: multicoin
            deps: agreements multicoin std sui
          - path: extensions/agreement_roles
            pins: armature multicoin
            deps: agreements armature roles std sui
          - path: integration/delivery_claim_tests
            pins: armature multicoin
            deps: agreement_roles agreements armature delivery_agreements multicoin roles std sui
    defaults:
      run:
        working-directory: packages/${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4

      # Sui CLI version. To bump: pick a mainnet-vX.Y.Z tag from
      # https://github.com/MystenLabs/sui/releases and update SUI_VERSION below.
      # Keep this within one minor of the local toolchain used to author/test
      # the package (currently sui 1.72.x).
      - name: Resolve Sui release info
        id: sui
        run: |
          set -euo pipefail
          SUI_VERSION="mainnet-v1.72.5"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) SUI_ARCH=x86_64 ;;
            aarch64|arm64) SUI_ARCH=aarch64 ;;
            *) echo "Unsupported runner arch: $ARCH" >&2; exit 1 ;;
          esac
          TARBALL="sui-${SUI_VERSION}-ubuntu-${SUI_ARCH}.tgz"
          echo "version=${SUI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Cache Sui CLI binary
        id: sui-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sui
          key: sui-${{ steps.sui.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Sui CLI
        if: steps.sui-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL -o /tmp/sui.tgz "${{ steps.sui.outputs.url }}"
          mkdir -p "$HOME/.local/bin"
          # Tarball entries are prefixed with "./" (./sui, ./sui-node, ...).
          # Extract only the sui CLI to keep the cached binary small.
          # NOTE: MystenLabs does not currently publish SHA256SUMS alongside the
          # release tarballs — we rely on the pinned tag + GitHub TLS as integrity
          # signal. Revisit if upstream starts publishing checksums.
          tar -xzf /tmp/sui.tgz -C "$HOME/.local/bin" ./sui
          chmod +x "$HOME/.local/bin/sui"

      - name: Expose Sui CLI on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: sui --version
        run: sui --version

      # The Sui framework and every git dependency are cloned into ~/.move.
      # The key changes with the CLI (which picks the framework rev) and with
      # any manifest (which picks the other revs); a stale restore only lacks
      # new revs, which the build then fetches.
      - name: Cache Move git dependencies
        uses: actions/cache@v4
        with:
          path: ~/.move
          key: move-${{ runner.os }}-${{ steps.sui.outputs.version }}-${{ matrix.path }}-${{ hashFiles('packages/**/Move.toml') }}
          restore-keys: |
            move-${{ runner.os }}-${{ steps.sui.outputs.version }}-${{ matrix.path }}-
            move-${{ runner.os }}-${{ steps.sui.outputs.version }}-

      # --build-env note: each package's Move.toml declares `testnet_stillness`
      # (publish target). CI builds under `testnet`, the lowest-common-
      # denominator env that resolves all transitive deps.
      #
      # `sui move build` is run explicitly before `sui move test` because the
      # `test` subcommand does NOT regenerate Move.lock when it's missing
      # (verified against sui 1.72.x — test only updates an existing lock).
      # CI checks out the repo with Move.lock gitignored, so without an
      # explicit build the lock would be absent and the dep-rev guard below
      # would fail with "Move.lock: No such file or directory" (which is
      # exactly how the prior version of this workflow failed at PR #12).
      - name: sui move build
        run: sui move build --build-env testnet

      - name: sui move test
        run: sui move test --build-env testnet

      # Issue #9: lockfile dep-rev guard (root pin presence + transitive-link audit).
      #
      # What this enforces, per package:
      #   1. Every shared rev the package depends on (matrix.pins) appears as a
      #      pinned source in its Move.lock. For armature_vault this is the
      #      original guard: if `override = true` is dropped on multicoin or the
      #      top-level world pin is removed, those deps reroute and the check
      #      fails.
      #   2. The package's direct dependencies are exactly within matrix.deps.
      #
      # What this DOES NOT enforce (intentionally surfaced, not failed):
      #   - Transitive packages may resolve multicoin/world to *different* revs.
      #     For example, warehouse_receipts itself links against multicoin_2
      #     (rev 330d339) and World (rev 8eb197e) — NOT our pins. Sui's resolver
      #     only applies `override = true` to the root package's own dep graph;
      #     transitive packages get their own resolution per importer.
      #
      #     Whether this affects runtime type identity at the deposit boundary
      #     depends on whether multicoin@330d339 / @c7a97f2 publish to the same
      #     on-chain address (manifest_digest equality on the multicoin entries
      #     suggests yes; world's digests differ, so world may not unify). This
      #     pre-existed PR #12 and is tracked in a separate follow-up issue.
      #
      #     The audit step below surfaces the transitive linkage on every
      #     armature_vault run so a regression there is visible in CI logs
      #     without failing the build; bake-in a strict assertion only after the
      #     follow-up resolves the runtime-identity question.
      - name: Check pinned dep revs in Move.lock
        env:
          PINS: ${{ matrix.pins }}
        run: |
          set -euo pipefail
          if [ ! -f Move.lock ]; then
            echo "::error::Move.lock not found in $(pwd). Did 'sui move build' get reordered before this step? (sui move test alone does NOT regenerate the lock.)"
            exit 1
          fi

          fail=0
          # Anchor the assertion to a `source = ... rev = "..."` line so a stray
          # SHA-shaped substring in a manifest_digest can't satisfy the check.
          for name in $PINS; do
            var="$(echo "$name" | tr '[:lower:]' '[:upper:]')_REV"
            rev="${!var}"
            if grep -qE "source = \{[^}]*rev = \"$rev\"" Move.lock; then
              echo "ok   $name pinned at $rev"
            else
              echo "FAIL $name expected $rev — no [pinned.testnet.*] source line carries it"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::Move.lock dep-rev drift detected. Either:"
            echo "  - You intentionally bumped a pin in Move.toml — update the"
            echo "    *_REV values at the top of this workflow to match."
            echo "  - You dropped \`override = true\` on multicoin or removed the"
            echo "    top-level world pin — restore the override so transitive"
            echo "    deps don't shadow our chosen rev for the root package."
            echo "  - A transitive dep changed and our override no longer fires."
            exit 1
          fi

      - name: Check dependency boundary
        env:
          ALLOWED: ${{ matrix.deps }}
        run: |
          set -euo pipefail
          NAME=$(sed -n 's/^name = "\(.*\)"$/\1/p' Move.toml | head -n 1)
          if [ -z "$NAME" ]; then
            echo "::error::no package name in $(pwd)/Move.toml"
            exit 1
          fi
          line=$(grep -A4 "^\[pinned\.testnet\.$NAME\]" Move.lock | grep '^deps = ' || true)
          if [ -z "$line" ]; then
            echo "::error::no [pinned.testnet.$NAME] deps line in Move.lock"
            exit 1
          fi
          echo "$NAME → $line"
          fail=0
          for dep in $(echo "$line" | grep -oE '[A-Za-z0-9_]+ = "' | sed 's/ = "//'); do
            case " $ALLOWED " in
              *" $dep "*) ;;
              *) echo "::error::$NAME depends on '$dep', which is not in its allowed list ($ALLOWED)"; fail=1 ;;
            esac
          done
          exit "$fail"

      # Surface (not fail) the transitive dep linkage so any regression in how
      # warehouse_receipts / armature themselves resolve multicoin and world is
      # visible in CI logs. Wrap as a heredoc-friendly soft-warn rather than a
      # hard gate while the runtime-identity question is open (follow-up issue).
      - name: Audit transitive dep linkage (informational)
        if: matrix.path == 'composites/armature_vault'
        run: |
          set -euo pipefail
          echo "Transitive dep mapping in Move.lock (informational — does not fail):"
          echo ""
          for pkg in armature_vault warehouse_receipts armature; do
            line=$(grep -A4 "^\[pinned\.testnet\.$pkg\]" Move.lock | grep '^deps = ' || true)
            if [ -n "$line" ]; then
              echo "  $pkg → $line"
            else
              echo "  $pkg → (no entry found)"
            fi
          done
          echo ""
          echo "Note: armature has no multicoin dependency since Cycle 7; only warehouse_receipts"
          echo "      links multicoin, and our override unifies it on rev 2772c26."
          echo "      Whether this affects runtime type identity at the deposit boundary is being"
          echo "      tracked separately."

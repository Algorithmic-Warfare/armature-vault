[package]
name = "roles"
version = "0.0.1"
edition = "2024"

# roles — the caller-identity primitive for role-gated packages in this repo.
# agreement_roles' claim gate and armature_vault (since Cycle 8) use it.
# A `Principal` is a player address, a machine key, or any board member of an
# armature OU. Each consuming package defines its own Role type and ACL.
#
# armature is pinned to armature `cycle-8` (`cf027e9`, Cycle 8), the same revision
# armature_vault uses, so `armature::ou::OU` is one type across the repo.
[dependencies]
armature = { git = "https://github.com/loash-industries/armature.git", subdir = "packages/armature_framework", rev = "cf027e9d518969d8f30c71d6264e2b927db2e32b" }

[environments]
testnet_stillness = "4c78adac"

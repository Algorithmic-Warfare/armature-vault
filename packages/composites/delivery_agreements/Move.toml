[package]
name = "delivery_agreements"
version = "0.0.1"
edition = "2024"

# delivery_agreements depends ONLY on multicoin and the `agreements` primitive
# (requests, requirements and `Spec`). The multicoin pin matches
# warehouse-receipts so that `multicoin::Balance` is the same published type in
# both packages and warehouse receipts can be used as cargo or delivery. Rewards,
# collateral and fees are Sui coins. Bump both together.
[dependencies]
agreements = { local = "../../primitives/agreements" }
multicoin = { git = "https://github.com/Algorithmic-Warfare/multicoin", subdir = "packages/multicoin", rev = "2772c26d24c02671726d39f167b8f772777875d9" }

[environments]
testnet_stillness = "4c78adac"

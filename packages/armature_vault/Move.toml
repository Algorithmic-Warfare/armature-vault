[package]
name = "armature_vault"
edition = "2024"
version = "0.0.1"

# armature_vault — an OU-gated vault for warehouse receipts (and, later,
# other shared resources). Players mint multicoin::Balance receipts via the
# warehouse_receipts package and deposit them here; access is gated by a
# dynamic, multi-principal ACL keyed on armature OU identity rather than a raw
# in-game tribe_id. Standalone, optional package: it lives outside the
# transitional armature_world_bridge because the vault outlives the bridge.
#
# Target environment: testnet_stillness — all deps resolve multicoin to 2772c26
# (0xdbb778cb...), world to rev d33ff23 (0x7be18d62...) and warehouse_receipts
# to main 212be7c (0x134dfa96...).
[dependencies]
armature = { git = "https://github.com/loash-industries/armature.git", subdir = "packages/armature_framework", rev = "ae60685f888ac5dd4d24413fb989002ef5315c74", override = true }
world = { git = "https://github.com/evefrontier/world-contracts.git", subdir = "contracts/world", rev = "d33ff232bd3878e8f9ad0721e18564b21facc925", override = true }
# override = true: unify warehouse_receipts on the same multicoin build (2772c26,
# 0xdbb778cb...) so `multicoin::Balance` receipts are the same on-chain type
# across the deposit boundary.
multicoin = { git = "https://github.com/Algorithmic-Warfare/multicoin", subdir = "packages/multicoin", rev = "2772c26d24c02671726d39f167b8f772777875d9", override = true }
# override = true: warehouse_receipts is pinned to a specific rev that aligns
# world and multicoin with the rest of this build. Drop the override only if
# upstream revs all resolve to the same on-chain addresses.
warehouse_receipts = { git = "https://github.com/loash-industries/warehouse-receipts.git", subdir = "packages/contracts", rev = "212be7c5ee1ee8bca55305e86e1ae549df78c279", override = true }

[environments]
testnet_stillness = "4c78adac"

